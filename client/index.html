<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chess app</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <h1>chess</h1>
    <canvas id="game" width="400" height="400">
        Your browser deos not support HTML canvas!
    </canvas>

    <br />
    <button onclick="createRoom();">create room</button>
    <button onclick="showJoinPrompt();">join room</button>
    <button id="resign" onclick="resign();" disabled>resign</button>
    <button id="draw" onclick="draw();" disabled>draw</button>
    <br />
    <p id="room">when you join, your room id will appear here</p>
</body>
</html>
